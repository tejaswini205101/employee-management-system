version: "3.9"

# Used by the Jenkins "Deploy" stage: pulls pre-built images from the
# registry instead of building them locally. Point $IMAGE_REGISTRY at
# whatever namespace the Jenkinsfile pushed to (e.g. yourdockerhubuser).
#
#   IMAGE_REGISTRY=yourdockerhubuser docker compose -f docker-compose.prod.yml pull
#   IMAGE_REGISTRY=yourdockerhubuser docker compose -f docker-compose.prod.yml up -d

services:
  mongodb:
    image: mongo:7
    container_name: ems-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mongo_data:/data/db
    networks:
      - ems-network

  backend:
    image: ${IMAGE_REGISTRY}/ems-backend:latest
    container_name: ems-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongodb:27017/?authSource=admin
      MONGO_DB_NAME: employee_management
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-in-production}
      CORS_ORIGINS: http://localhost
    networks:
      - ems-network

  frontend:
    image: ${IMAGE_REGISTRY}/ems-frontend:latest
    container_name: ems-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ems-network

volumes:
  mongo_data:

networks:
  ems-network:
    driver: bridge
